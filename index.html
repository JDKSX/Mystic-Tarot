<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1f" />
  <title>Mystic Tarot · ไพ่ทาโรต์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Charm:wght@400;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ชั้นดาวพื้นหลัง -->
  <div class="stars" id="stars" aria-hidden="true"></div>

  <!-- ========== ประตูเข้า: กรอกชื่อ (ใช้ชื่อสมมติได้) ========== -->
  <section id="gate" class="gate" hidden>
    <div class="gate__inner">
      <div class="gate__glyph">✦</div>
      <h1 class="gate__title">Mystic Tarot</h1>
      <p class="gate__sub">ประตูสู่การสะท้อนตนเองผ่านไพ่ทาโรต์</p>
      <form id="gateForm" class="gate__form" autocomplete="off">
        <label for="userName" class="gate__label">เราจะเรียกคุณว่าอะไรดี?</label>
        <input id="userName" class="gate__input" type="text" inputmode="text"
               placeholder="พิมพ์ชื่อของคุณ" maxlength="24" spellcheck="false" />
        <button type="submit" class="btn btn--gold gate__btn">เข้าสู่ห้องไพ่ ✦</button>
        <p id="gateError" class="gate__error" role="alert" hidden>กรุณาพิมพ์ชื่ออย่างน้อย 1 ตัวอักษร</p>
      </form>
      <p class="gate__hint">ใช้ชื่อสมมติได้ · เราไม่เก็บข้อมูลส่วนตัวของคุณ</p>
    </div>
  </section>

  <!-- ========== แอปหลัก ========== -->
  <div id="app" class="app" hidden>
    <!-- แถบบน -->
    <header class="topbar">
      <button class="topbar__back" id="btnBack" aria-label="ย้อนกลับ" hidden>‹</button>
      <div class="topbar__brand" data-nav="home">✦ Mystic Tarot</div>
      <button class="topbar__menu" id="btnMenu" aria-label="เมนู"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    </header>

    <!-- เนื้อหาเปลี่ยนตาม view -->
    <main id="view" class="view"></main>

    <!-- แถบล่าง (มือถือ) -->
    <nav class="tabbar">
      <button class="tabbar__item" data-nav="home"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg></span>หน้าแรก</button>
      <button class="tabbar__item" data-nav="daily"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m-8-10H2m20 0h-2m-2.93-7.07l-1.41 1.41m-9.32 9.32l-1.41 1.41m0-12.14l1.41 1.41m9.32 9.32l1.41 1.41"/></svg></span>ไพ่วันนี้</button>
      <button class="tabbar__item tabbar__item--main" data-nav="topic"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.09 6.26H21l-5.55 4.02L17.54 18.54 12 14.48l-5.54 4.06 2.09-6.26L3 8.26h6.91z"/></svg></span>เปิดไพ่</button>
      <button class="tabbar__item" data-nav="history"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 00-2 2v14c0 1.1.9 2 2 2h3m0-18h11a2 2 0 012 2v10a2 2 0 01-2 2H8m0-14v14m0 4a2 2 0 01-2-2m2 2a2 2 0 002-2m-2 2V3"/></svg></span>ประวัติ</button>
      <button class="tabbar__item" data-nav="library"><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5z"/></svg></span>คลังไพ่</button>
    </nav>

    <!-- เมนูลิ้นชัก -->
    <div class="drawer" id="drawer" hidden>
      <div class="drawer__scrim" data-close-drawer></div>
      <aside class="drawer__panel">
        <div class="drawer__head">เมนู</div>
        <button class="drawer__link" data-nav="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg> หน้าแรก</button>
        <button class="drawer__link" data-nav="topic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.09 6.26H21l-5.55 4.02L17.54 18.54 12 14.48l-5.54 4.06 2.09-6.26L3 8.26h6.91z"/></svg> เริ่มเปิดไพ่</button>
        <button class="drawer__link" data-nav="daily"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m-8-10H2m20 0h-2m-2.93-7.07l-1.41 1.41m-9.32 9.32l-1.41 1.41m0-12.14l1.41 1.41m9.32 9.32l1.41 1.41"/></svg> ไพ่ประจำวัน</button>
        <button class="drawer__link" data-nav="library"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5z"/></svg> คลังไพ่ 78 ใบ</button>
        <button class="drawer__link" data-nav="history"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 00-2 2v14c0 1.1.9 2 2 2h3m0-18h11a2 2 0 012 2v10a2 2 0 01-2 2H8m0-14v14m0 4a2 2 0 01-2-2m2 2a2 2 0 002-2m-2 2V3"/></svg> ประวัติการเปิดไพ่</button>
        <button class="drawer__link" data-nav="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1.08 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001.08 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1.08z"/></svg> ตั้งค่า</button>
        <button class="drawer__link" data-nav="about"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg> เกี่ยวกับ / คำเตือน</button>
        <div class="drawer__foot">
          <button class="drawer__logout" id="btnLogout">ออกจากระบบ</button>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/tarot-deck.js"></script>
  <script src="js/tarot-engine.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
